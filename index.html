<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Wishes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#ffd6e8,#ffe8f2);
    overflow:hidden;
}

.card{
    width:380px;
    background:#fff;
    border-radius:25px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    position:relative;
}

h1{
    color:#ff3d7f;
    font-size:50px;
    margin-bottom:20px;
}

.btn{
    width:100%;
    padding:18px;
    margin:12px 0;
    border:none;
    border-radius:50px;
    color:#fff;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn1{
    background:#005dff;
}

.btn2{
    background:#00b326;
}

.btn:hover{
    transform:scale(1.03);
}

#wish{
    display:none;
    margin-top:25px;
    background:#fff5fa;
    padding:20px;
    border-radius:15px;
    border:2px dashed #ff7bac;
    color:#d81b60;
    font-size:22px;
    line-height:1.6;
    animation:fade .5s;
}

@keyframes fade{
from{opacity:0;transform:scale(.8);}
to{opacity:1;transform:scale(1);}
}

.balloon{
    position:absolute;
    font-size:35px;
    animation:float 5s infinite;
}

.b1{left:-15px;top:10px;}
.b2{right:-15px;top:20px;}
.b3{left:10px;bottom:10px;}
.b4{right:10px;bottom:10px;}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}
</style>
</head>

<body>

<div class="card">

<div class="balloon b1">🎈</div>
<div class="balloon b2">🎉</div>
<div class="balloon b3">🎁</div>
<div class="balloon b4">🎂</div>

<h1>Happy Birthday!</h1>
<h3>Click please!</h3>
<button class="btn btn1" onclick="wish1()">
👤 M. Yousaf
</button>

<button class="btn btn2" onclick="wish2()">
👤 Azlan Khan
</button>

<div id="wish"></div>

</div>

<script>

function wish1(){
document.getElementById("wish").style.display="block";
document.getElementById("wish").innerHTML=
"🎉 <b>Happy Birthday M. Yousaf!</b> 🎂<br><br>May your life be filled with happiness, success, good health and countless blessings. Wishing you a wonderful year ahead! ❤️";
}

function wish2(){
document.getElementById("wish").style.display="block";
document.getElementById("wish").innerHTML=
"🎉 <b>Happy Birthday Azlan Khan!</b> 🎂<br><br>May Allah bless you with joy, prosperity, good health and endless success. Have an amazing birthday and a fantastic year ahead! 🎈";
}

</script>

</body>
</html>
