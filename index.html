<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<style>

body{
    margin:0;
    padding:0;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:450px;
    background:white;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0px 0px 20px rgba(0,0,0,0.3);
}

h1{
    color:#ff4081;
    font-size:42px;
    margin-bottom:10px;
}

h2{
    color:#444;
}

p{
    font-size:20px;
    color:#666;
    line-height:1.6;
}

.cake{
    font-size:80px;
    animation:bounce 1s infinite alternate;
}

@keyframes bounce{
from{
transform:translateY(0px);
}
to{
transform:translateY(-15px);
}
}

.btn{
    margin-top:20px;
    background:#ff4081;
    color:white;
    border:none;
    padding:12px 30px;
    font-size:18px;
    border-radius:30px;
    cursor:pointer;
}

.btn:hover{
    background:#e91e63;
}

.footer{
    margin-top:20px;
    font-size:18px;
    color:#999;
}

</style>

</head>

<body>

<div class="card">

<div class="cake">
🎂
</div>

<h1>Happy Birthday!</h1>

<h2>Dear M.Yousaf & Azlan Khan</h2>

<p>
May your birthday bring you endless happiness,
good health, success, and beautiful memories.
May all your dreams come true and your life be
filled with joy and blessings.
</p>

<button class="btn"
onclick="alert('🎉 Wishing You a Very Happy Birthday! 🎉')">
Click for Wishes
</button>

<div class="footer">
🎈🎁🎊 Best Wishes 🎊🎁🎈
</div>

</div>

</body>
</html>
